# 018 US3 — encrypted internal traffic overlay (FR-007/008/012, SC-004/005/008).
#
#   docker compose -f docker-compose.yml -f docker-compose.mtls.yml up --build -d
#
# Brings the whole stack up with encryption ON and NO manual certificate steps (SC-008): the `certs`
# init container generates the dev CA, one bundle per service and server certs for Postgres/Redis into
# a shared volume before anything else starts. Nothing secret is committed (FR-011) — the volume is
# generated at run time and docker/certs/generated is gitignored.
#
# Kept as an overlay rather than folded into docker-compose.yml so the plaintext stack stays runnable
# for anyone debugging without certificates.

services:
  # --- cert bootstrap (runs to completion, then everything else starts) --------------------------
  certs:
    image: alpine/openssl:latest
    entrypoint: ["/bin/sh", "-c"]
    # openssl + keytool: the alpine/openssl image has openssl; keytool comes from the JRE package.
    command: >
      "apk add --no-cache openjdk17-jre-headless bash >/dev/null 2>&1 &&
       bash /bootstrap/bootstrap-certs.sh /certs"
    environment:
      CERT_KEYSTORE_PASSWORD: ${CERT_KEYSTORE_PASSWORD:-changeit}
      POSTGRES_UID: ${POSTGRES_UID:-70}      # postgres:16-alpine runs as uid 70
      REDIS_UID: ${REDIS_UID:-999}
    volumes:
      - ./docker/certs:/bootstrap:ro
      - kita-certs:/certs
    networks: [kita]

  # --- datastores now terminate TLS too (max-security clarification) ----------------------------
  postgres:
    depends_on:
      certs:
        condition: service_completed_successfully
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/postgres.crt
      - -c
      - ssl_key_file=/certs/postgres.key
      - -c
      - ssl_ca_file=/certs/ca.crt
    volumes:
      - kita-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - kita-certs:/certs:ro

  redis:
    depends_on:
      certs:
        condition: service_completed_successfully
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --port
      - "0"                       # plaintext port off entirely
      - --tls-port
      - "6379"
      - --tls-cert-file
      - /certs/redis.crt
      - --tls-key-file
      - /certs/redis.key
      - --tls-ca-cert-file
      - /certs/ca.crt
      - --tls-auth-clients
      - "no"                      # clients authenticate to Redis by password, not by certificate
    volumes:
      - kita-redisdata:/data
      - kita-certs:/certs:ro
    healthcheck:
      test: ["CMD", "redis-cli", "--tls", "--cacert", "/certs/ca.crt", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- backend services: server TLS + client identity + TLS to Postgres/Redis --------------------
  operations-service: &mtls-service
    depends_on:
      certs:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: mtls
      SSL_KEYSTORE: file:/certs/operations-service.p12
      SSL_TRUSTSTORE: file:/certs/truststore.p12
      SSL_KEYSTORE_PASSWORD: ${CERT_KEYSTORE_PASSWORD:-changeit}
      SSL_TRUSTSTORE_PASSWORD: ${CERT_KEYSTORE_PASSWORD:-changeit}
      MTLS_ALLOWED_CNS: ${MTLS_ALLOWED_CNS:-workflow-service,gateway}
      DATABASE_URL: jdbc:postgresql://postgres:5432/kita?currentSchema=operations,public&ssl=true&sslmode=verify-full&sslrootcert=/certs/ca.crt
    volumes:
      - kita-certs:/certs:ro
    healthcheck:
      # the service now speaks https; --no-check-certificate because the CA is private to this stack
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  hr-service:
    <<: *mtls-service
    environment:
      SPRING_PROFILES_ACTIVE: mtls
      SSL_KEYSTORE: file:/certs/hr-service.p12
      SSL_TRUSTSTORE: file:/certs/truststore.p12
      SSL_KEYSTORE_PASSWORD: ${CERT_KEYSTORE_PASSWORD:-changeit}
      SSL_TRUSTSTORE_PASSWORD: ${CERT_KEYSTORE_PASSWORD:-changeit}
      MTLS_ALLOWED_CNS: ${MTLS_ALLOWED_CNS:-workflow-service,gateway}
      DATABASE_URL: jdbc:postgresql://postgres:5432/kita?currentSchema=hr,public&ssl=true&sslmode=verify-full&sslrootcert=/certs/ca.crt
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://localhost:8085/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  crm-service:
    <<: *mtls-service
    environment:
      SPRING_PROFILES_ACTIVE: mtls
      SSL_KEYSTORE: file:/certs/crm-service.p12
      SSL_TRUSTSTORE: file:/certs/truststore.p12
      SSL_KEYSTORE_PASSWORD: ${CERT_KEYSTORE_PASSWORD:-changeit}
      SSL_TRUSTSTORE_PASSWORD: ${CERT_KEYSTORE_PASSWORD:-changeit}
      MTLS_ALLOWED_CNS: ${MTLS_ALLOWED_CNS:-workflow-service,gateway}
      DATABASE_URL: jdbc:postgresql://postgres:5432/kita?currentSchema=crm,public&ssl=true&sslmode=verify-full&sslrootcert=/certs/ca.crt
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://localhost:8086/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  procurement-service:
    <<: *mtls-service
    environment:
      SPRING_PROFILES_ACTIVE: mtls
      SSL_KEYSTORE: file:/certs/procurement-service.p12
      SSL_TRUSTSTORE: file:/certs/truststore.p12
      SSL_KEYSTORE_PASSWORD: ${CERT_KEYSTORE_PASSWORD:-changeit}
      SSL_TRUSTSTORE_PASSWORD: ${CERT_KEYSTORE_PASSWORD:-changeit}
      MTLS_ALLOWED_CNS: ${MTLS_ALLOWED_CNS:-workflow-service,gateway}
      DATABASE_URL: jdbc:postgresql://postgres:5432/kita?currentSchema=procurement,public&ssl=true&sslmode=verify-full&sslrootcert=/certs/ca.crt
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://localhost:8087/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  workflow-service:
    <<: *mtls-service
    environment:
      SPRING_PROFILES_ACTIVE: mtls
      SSL_KEYSTORE: file:/certs/workflow-service.p12
      SSL_TRUSTSTORE: file:/certs/truststore.p12
      SSL_KEYSTORE_PASSWORD: ${CERT_KEYSTORE_PASSWORD:-changeit}
      SSL_TRUSTSTORE_PASSWORD: ${CERT_KEYSTORE_PASSWORD:-changeit}
      MTLS_ALLOWED_CNS: ${MTLS_ALLOWED_CNS:-gateway}   # only the gateway calls the orchestrator
      DATABASE_URL: jdbc:postgresql://postgres:5432/kita?currentSchema=workflow,public&ssl=true&sslmode=verify-full&sslrootcert=/certs/ca.crt
      # the orchestrated calls now go over https to the real services
      OPERATIONS_ADAPTER: http
      HR_ADAPTER: http
      CRM_ADAPTER: http
      PROCUREMENT_ADAPTER: http
      OPERATIONS_BASE_URL: https://operations-service:8083
      HR_BASE_URL: https://hr-service:8085
      CRM_BASE_URL: https://crm-service:8086
      PROCUREMENT_BASE_URL: https://procurement-service:8087
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://localhost:8088/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # Public entry point: browser-facing TLS is unchanged (out of scope) — only its OUTBOUND leg to the
  # backends becomes mutually authenticated, so no server.ssl / client-auth here.
  gateway:
    depends_on:
      certs:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: mtls
      SSL_KEYSTORE: file:/certs/gateway.p12
      SSL_TRUSTSTORE: file:/certs/truststore.p12
      SSL_KEYSTORE_PASSWORD: ${CERT_KEYSTORE_PASSWORD:-changeit}
      SSL_TRUSTSTORE_PASSWORD: ${CERT_KEYSTORE_PASSWORD:-changeit}
      OPERATIONS_SERVICE_URL: https://operations-service:8083
      HR_SERVICE_URL: https://hr-service:8085
      CRM_SERVICE_URL: https://crm-service:8086
      PROCUREMENT_SERVICE_URL: https://procurement-service:8087
      WORKFLOW_SERVICE_URL: https://workflow-service:8088
    volumes:
      - kita-certs:/certs:ro

volumes:
  kita-certs:
