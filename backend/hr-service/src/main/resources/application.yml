server:
  port: 8085

spring:
  application:
    name: hr-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/kita?currentSchema=hr,public}
    username: ${DATABASE_USER:kita}
    password: ${DATABASE_PASSWORD:change-me}
    hikari:
      # search_path so unqualified SQL (incl. tests) resolves to this service's schema, public second
      # for shared extensions. Applies at runtime and under Testcontainers (which override only the url).
      connection-init-sql: SET search_path TO hr, public
  jpa:
    hibernate:
      ddl-auto: validate # schema owned by Flyway
    open-in-view: false
    properties:
      hibernate:
        default_schema: hr
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: hr      # Flyway creates + owns this service's schema (history table lives here)
    schemas: hr
    create-schemas: true

hr:
  security:
    # 017 FR-018/SC-008: an absent X-Kita-Roles header now grants NOTHING. This was
    # "grant every role", a fair convenience while there was no login and a hole once
    # there is one. Enable it only for isolated :hr-service:test runs.
    stub: ${HR_SECURITY_STUB:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
